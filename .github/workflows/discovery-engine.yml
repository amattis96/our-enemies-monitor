name: Deterministic Discovery Engine (Shadow)

on:
  schedule:
    # Run daily at 01:15 UTC in shadow mode without mutating canonical data or opening PRs.
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discovery-engine-shadow
  cancel-in-progress: true

jobs:
  discovery-shadow:
    name: discovery-shadow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run deterministic discovery in shadow mode
        run: |
          node --input-type=module <<'NODE'
          import { createDefaultLifecycleRegistry, evaluateBackpressure } from "./src/orchestration/index.ts";
          import { evaluateDormantCases } from "./src/discovery/dormant.ts";
          import { readDataFiles } from "./src/pipeline/load.ts";

          const registry = createDefaultLifecycleRegistry();
          const gate = registry.canExecute("discovery-engine");
          if (!gate.allowed || gate.mutates_production) {
            throw new Error(`Discovery engine must run in non-mutating shadow mode, got: ${JSON.stringify(gate)}`);
          }
          const backpressure = evaluateBackpressure({ open_prs: 0, review_queue: 0, avg_wait_minutes: 0 });
          const data = readDataFiles();
          const dormantSummary = evaluateDormantCases([], { now: new Date().toISOString().replace(/\.\d{3}Z$/, "Z") });
          console.log(JSON.stringify({
            mode: gate.effective_mode,
            mutates_production: gate.mutates_production,
            backpressure_level: backpressure.level,
            entities_loaded: data.entities.length,
            events_loaded: data.events.length,
            dormant_evaluated: dormantSummary.evaluations.length,
          }, null, 2));
          NODE

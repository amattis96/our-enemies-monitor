name: Stage deterministic OSINT ingest

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# The privileged job checks out the trusted main branch, never PR head code.
# The GITHUB_TOKEN pushes only a candidate branch. A ChatGPT task opens its PR
# through its separate GitHub connection, causing required PR checks to run.
permissions:
  contents: read

concurrency:
  group: osint-ingest-staging
  cancel-in-progress: false

jobs:
  prepare:
    permissions:
      contents: read
      pull-requests: read
    outputs:
      staged: ${{ steps.candidate.outputs.staged }}
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: tip
        name: Verify successful CI belongs to current main
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main
          actual=$(git rev-parse HEAD)
          current=$(git rev-parse origin/main)
          if [ "$actual" != "$current" ] || { [ -n "$EXPECTED_SHA" ] && [ "$actual" != "$EXPECTED_SHA" ]; }; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Stale workflow run; current main is $current" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.tip.outputs.current == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.tip.outputs.current == 'true'
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        if: steps.tip.outputs.current == 'true'
        run: pnpm install --frozen-lockfile
      - id: pending
        name: Find earliest archived, not-yet-ingested sidecar
        if: steps.tip.outputs.current == 'true'
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          import { execFileSync } from "node:child_process";
          import { readArchive, isIngested } from "./src/pipeline/ingest/archive.ts";
          import { readDataFiles } from "./src/pipeline/load.ts";
          import { repoPath } from "./src/pipeline/paths.ts";
          import { validateDataFiles } from "./src/pipeline/validate.ts";

          const result = validateDataFiles(readDataFiles());
          if (result.issues.some((issue) => issue.severity === "error")) {
            throw new Error("Canonical data is invalid; ingest staging is blocked.");
          }
          const archive = readArchive(repoPath("sources/incremental"));
          if (archive.invalid.length) {
            throw new Error("Invalid archived sidecar; correct the archive before staging.");
          }
          const next = archive.sidecars.find((sidecar) => !isIngested(sidecar.proposals, result.dataset));
          if (!next) {
            appendFileSync(process.env.GITHUB_OUTPUT, "found=false\n");
            console.log("No pending archived sidecars.");
          } else {
            const code = next.proposals.source.code;
            const base = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
            if (!/^[0-9a-f]{40}$/.test(base)) throw new Error("Invalid main SHA");
            appendFileSync(
              process.env.GITHUB_OUTPUT,
              "found=true\ncode=" + code + "\npath=" + next.path +
                "\nbranch=agent/ingest-fonte-" + code.slice(1).toLowerCase() + "-" + base + "\n",
            );
            console.log("First pending sidecar: " + code + " (" + next.path + ")");
          }
          NODE
      - id: guard
        name: Avoid parallel ingest branches and PRs
        if: steps.pending.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pending.outputs.branch }}
        run: |
          if gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName \
            --jq '.[] | select(.headRefName | startswith("agent/ingest-")) | .headRefName' | grep -q .; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "An ingest PR is already open; deferring the next sidecar." >> "$GITHUB_STEP_SUMMARY"
          elif git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Candidate for this exact main SHA already exists; Task A must verify and open its PR: $BRANCH." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi
      - id: candidate
        name: Build and validate candidate in read-only context
        if: steps.guard.outputs.proceed == 'true'
        env:
          SIDECAR: ${{ steps.pending.outputs.path }}
          CODE: ${{ steps.pending.outputs.code }}
          BRANCH: ${{ steps.pending.outputs.branch }}
        run: |
          set -euo pipefail
          git switch -c "$BRANCH"
          node src/cli/ingest.ts "$SIDECAR" --json > /tmp/oem-ingest-plan.json
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync("/tmp/oem-ingest-plan.json", "utf8"));
          const errors = report.validation.filter((entry) => entry.severity === "error");
          if (report.fatal.length || errors.length || report.summary.conflict || report.summary.rejected) {
            console.error("Unresolved conflicts/rejections; no candidate branch will be pushed.");
            console.error(JSON.stringify({
              source: report.source, summary: report.summary, fatal: report.fatal,
              validationErrors: errors, attention: report.attention,
            }, null, 2));
            process.exit(1);
          }
          NODE
          pnpm ingest "$SIDECAR" --write
          pnpm format:data
          pnpm check
          git add -- data
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No candidate data changes; refusing an empty branch." >&2
            exit 1
          fi
          if git diff --cached --name-only | grep -v '^data/' ; then
            echo "Ingest modified a forbidden path; refusing to push." >&2
            exit 1
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "feat(data): stage ingest $CODE candidates" \
            -m "Staging-Base: $(git rev-parse HEAD)" \
            -m "Staging-Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          pnpm data:diff --base origin/main --branch "$BRANCH"
          git diff --check origin/main...HEAD
          # A moving main invalidates an ingest branch. Never push stale data.
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          mkdir -p "$RUNNER_TEMP/oem-ingest"
          git bundle create "$RUNNER_TEMP/oem-ingest/candidate.bundle" "$BRANCH"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          d = pathlib.Path(os.environ["RUNNER_TEMP"]) / "oem-ingest"
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          manifest = {
              "base": git("rev-parse", "origin/main"),
              "head": git("rev-parse", "HEAD"),
              "branch": os.environ["BRANCH"],
              "digest": hashlib.sha256((d / "candidate.bundle").read_bytes()).hexdigest(),
          }
          (d / "manifest.json").write_text(json.dumps(manifest) + "\n", encoding="utf-8")
          PY
          echo "staged=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.candidate.outputs.staged == 'true'
        with:
          name: osint-ingest-candidate
          path: ${{ runner.temp }}/oem-ingest/
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: prepare
    if: needs.prepare.outputs.staged == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: osint-ingest-candidate
          path: ${{ runner.temp }}/oem-ingest-downloaded
      - name: Verify staged Git objects and push only the candidate ref
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_DIR: ${{ runner.temp }}/oem-ingest-downloaded
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/manifest-values"
          import hashlib, json, os, pathlib, re, sys
          d = pathlib.Path(os.environ["ARTIFACT_DIR"])
          m = json.loads((d / "manifest.json").read_text(encoding="utf-8"))
          sha = re.compile(r"[a-f0-9]{40}")
          branch = re.compile(r"agent/ingest-fonte-[1-9][0-9]+-[a-f0-9]{40}")
          if not sha.fullmatch(m.get("base", "")) or not sha.fullmatch(m.get("head", "")):
              sys.exit("Invalid commit SHA")
          if not branch.fullmatch(m.get("branch", "")) or not m["branch"].endswith("-" + m["base"]):
              sys.exit("Invalid branch")
          if hashlib.sha256((d / "candidate.bundle").read_bytes()).hexdigest() != m.get("digest"):
              sys.exit("Bundle digest mismatch")
          print(m["base"])
          print(m["head"])
          print(m["branch"])
          PY
          BASE=$(sed -n '1p' "$RUNNER_TEMP/manifest-values")
          HEAD=$(sed -n '2p' "$RUNNER_TEMP/manifest-values")
          BRANCH=$(sed -n '3p' "$RUNNER_TEMP/manifest-values")
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$BASE"
          git init --bare --quiet "$RUNNER_TEMP/oem-publish.git"
          git -C "$RUNNER_TEMP/oem-publish.git" fetch "$ARTIFACT_DIR/candidate.bundle" "refs/heads/$BRANCH:refs/heads/$BRANCH"
          test "$(git -C "$RUNNER_TEMP/oem-publish.git" rev-parse "refs/heads/$BRANCH")" = "$HEAD"
          test "$(git -C "$RUNNER_TEMP/oem-publish.git" rev-parse "$HEAD^")" = "$BASE"
          git -C "$RUNNER_TEMP/oem-publish.git" fsck --no-reflogs
          test -n "$(git -C "$RUNNER_TEMP/oem-publish.git" diff --name-only "$BASE" "$HEAD")"
          if git -C "$RUNNER_TEMP/oem-publish.git" diff --name-only "$BASE" "$HEAD" | grep -v '^data/' ; then
            echo "Forbidden path in candidate diff." >&2
            exit 1
          fi
          git -C "$RUNNER_TEMP/oem-publish.git" diff --check "$BASE" "$HEAD"
          if gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName \
            --jq '.[] | select(.headRefName | startswith("agent/ingest-")) | .headRefName' | grep -q .; then
            echo "Open ingest PR exists, refusing competing branch." >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            echo "Candidate branch already exists, refusing overwrite." >&2
            exit 1
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$BASE"
          gh auth setup-git
          git -C "$RUNNER_TEMP/oem-publish.git" push "https://github.com/$GITHUB_REPOSITORY.git" \
            "$HEAD:refs/heads/$BRANCH"
          {
            echo "Staged $BRANCH at $HEAD from main $BASE."
            echo "No PR, merge, review promotion or public data change."
          } >> "$GITHUB_STEP_SUMMARY"

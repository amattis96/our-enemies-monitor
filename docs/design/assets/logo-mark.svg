<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="oem-logo-title">
  <title id="oem-logo-title">Our Enemies Monitor</title>
  <!--
    "The Lens" — Dossier mark v1. An instrument bezel (the monitoring room)
    framing three pinned clues joined by thread (the investigation board);
    one thread is the red string. Ink = currentColor, red = --signal.
    Minimum size 32px; below that use favicon.svg.
  -->
  <defs>
    <line id="oem-tick" x1="32" y1="5.6" x2="32" y2="7.6" stroke="currentColor" stroke-width="0.9" stroke-linecap="round"/>
    <line id="oem-major" x1="32" y1="4.4" x2="32" y2="8.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  </defs>

  <!-- bezel -->
  <circle cx="32" cy="32" r="29.25" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="23.6" fill="none" stroke="currentColor" stroke-width="0.75" opacity="0.55"/>

  <!-- dial: majors on the cardinals, minors every 15° -->
  <use href="#oem-major"/>
  <use href="#oem-major" transform="rotate(90 32 32)"/>
  <use href="#oem-major" transform="rotate(180 32 32)"/>
  <use href="#oem-major" transform="rotate(270 32 32)"/>
  <use href="#oem-tick" transform="rotate(15 32 32)"/>
  <use href="#oem-tick" transform="rotate(30 32 32)"/>
  <use href="#oem-tick" transform="rotate(45 32 32)"/>
  <use href="#oem-tick" transform="rotate(60 32 32)"/>
  <use href="#oem-tick" transform="rotate(75 32 32)"/>
  <use href="#oem-tick" transform="rotate(105 32 32)"/>
  <use href="#oem-tick" transform="rotate(120 32 32)"/>
  <use href="#oem-tick" transform="rotate(135 32 32)"/>
  <use href="#oem-tick" transform="rotate(150 32 32)"/>
  <use href="#oem-tick" transform="rotate(165 32 32)"/>
  <use href="#oem-tick" transform="rotate(195 32 32)"/>
  <use href="#oem-tick" transform="rotate(210 32 32)"/>
  <use href="#oem-tick" transform="rotate(225 32 32)"/>
  <use href="#oem-tick" transform="rotate(240 32 32)"/>
  <use href="#oem-tick" transform="rotate(255 32 32)"/>
  <use href="#oem-tick" transform="rotate(285 32 32)"/>
  <use href="#oem-tick" transform="rotate(300 32 32)"/>
  <use href="#oem-tick" transform="rotate(315 32 32)"/>
  <use href="#oem-tick" transform="rotate(330 32 32)"/>
  <use href="#oem-tick" transform="rotate(345 32 32)"/>

  <!-- graticule -->
  <g fill="none" stroke="currentColor" stroke-width="0.6" opacity="0.3">
    <path d="M9 32h46M32 9v46"/>
    <ellipse cx="32" cy="32" rx="11" ry="23"/>
  </g>

  <!-- sweep -->
  <path d="M32 32 32 8.4A23.6 23.6 0 0 1 51.33 18.46Z" fill="var(--signal, #b3261e)" opacity="0.14"/>
  <path d="M32 32 51.33 18.46" stroke="var(--signal, #b3261e)" stroke-width="0.9" stroke-linecap="round" opacity="0.7"/>

  <!-- threads (the red string runs between the first two clues) -->
  <g fill="none" stroke-linecap="round">
    <path d="M44 27Q39.5 37.5 29 44" stroke="currentColor" stroke-width="1.6"/>
    <path d="M29 44Q22.5 35 21 24" stroke="currentColor" stroke-width="1.6"/>
    <path d="M21 24Q32.5 30 44 27" stroke="var(--signal, #b3261e)" stroke-width="2"/>
  </g>

  <!-- pins: shadow, head, highlight -->
  <g>
    <circle cx="21.8" cy="25" r="3.6" fill="currentColor" opacity="0.18"/>
    <circle cx="21" cy="24" r="3.6" fill="var(--signal, #b3261e)"/>
    <circle cx="19.9" cy="22.9" r="1.1" fill="#fff" opacity="0.7"/>
    <circle cx="44.8" cy="28" r="3.2" fill="currentColor" opacity="0.18"/>
    <circle cx="44" cy="27" r="3.2" fill="currentColor"/>
    <circle cx="43" cy="26" r="0.95" fill="#fff" opacity="0.55"/>
    <circle cx="29.8" cy="45" r="3.2" fill="currentColor" opacity="0.18"/>
    <circle cx="29" cy="44" r="3.2" fill="currentColor"/>
    <circle cx="28" cy="43" r="0.95" fill="#fff" opacity="0.55"/>
  </g>
</svg>
